<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<style>
:root{--navy:#2F4459;--navy-dark:#1b2a3a;--navy-deep:#111c28;--gold:#D9BB63;--gold-light:#f0dc9c;--gold-dark:#b8983f;--ease:cubic-bezier(.7,0,.2,1)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;overflow-x:hidden}
body{font-family:"Cairo","Segoe UI",Tahoma,sans-serif;background:#f6f4ee;color:var(--navy);line-height:1.9;overflow-x:hidden}
a{text-decoration:none;color:inherit}ul{list-style:none}img{max-width:100%;display:block}
.progress{position:fixed;top:0;right:0;height:4px;width:0;background:linear-gradient(90deg,var(--gold-dark),var(--gold-light));z-index:200}
.hd{position:fixed;top:0;right:0;left:0;z-index:100;background:rgba(17,28,40,.95);backdrop-filter:blur(12px);border-bottom:1px solid rgba(217,187,99,.35)}
.hd__in{max-width:1200px;margin:0 auto;height:78px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;font-size:.88rem;font-weight:700;color:var(--gold);border:1.5px solid var(--gold);border-radius:50px;transition:.35s}
.back:hover{background:var(--gold);color:var(--navy-deep);transform:translateX(4px)}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;font-size:1.1rem;color:var(--gold-light)}
.brand img{height:56px;width:auto}
.hero{position:relative;padding:150px 20px 90px;text-align:center;color:#fff;overflow:hidden;background:linear-gradient(160deg,var(--navy),var(--navy-deep))}
.hero__bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.22}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,#f6f4ee00 60%,rgba(17,28,40,.6))}
.hero__in{position:relative;z-index:2;max-width:860px;margin:0 auto;animation:up .9s var(--ease) both}
.tag{display:inline-block;padding:6px 22px;margin-bottom:18px;font-size:.85rem;font-weight:800;color:var(--navy-deep);background:linear-gradient(135deg,var(--gold-light),var(--gold));border-radius:50px}
.hero h1{font-size:clamp(1.7rem,4.6vw,3rem);font-weight:900;line-height:1.55;margin-bottom:18px}
.meta{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 22px;font-size:.88rem;color:rgba(255,255,255,.8)}
@keyframes up{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
.wrap{max-width:820px;margin:-40px auto 0;padding:0 16px 60px;position:relative;z-index:3}
.card{background:#fff;border-radius:26px;padding:clamp(24px,5vw,54px);box-shadow:0 26px 60px rgba(47,68,89,.18);border-top:5px solid var(--gold)}
.lead{font-size:1.15rem;font-weight:600;padding-right:18px;border-right:4px solid var(--gold);margin-bottom:34px;color:var(--navy)}
.sec{margin-bottom:34px;opacity:0;transform:translateY(30px);transition:.8s var(--ease)}
.sec.in{opacity:1;transform:none}
.sec h2{position:relative;font-size:1.45rem;font-weight:900;margin-bottom:14px;padding-right:44px}
.sec h2 b{position:absolute;right:0;top:2px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:.9rem;color:var(--navy-deep);background:linear-gradient(135deg,var(--gold-light),var(--gold));border-radius:10px}
.sec p{color:#44566a;margin-bottom:12px}
.sec ul{margin:10px 0}
.sec li{position:relative;padding:6px 32px 6px 0;color:#44566a}
.sec li::before{content:"\2713";position:absolute;right:0;top:9px;width:22px;height:22px;display:flex;align-items:center;justify-content:center;font-size:.7rem;color:var(--navy-deep);background:var(--gold);border-radius:50%}
.quote{margin:34px 0;padding:24px 26px;font-weight:700;font-size:1.05rem;color:var(--gold-light);background:linear-gradient(135deg,var(--navy),var(--navy-deep));border-radius:20px;border-right:5px solid var(--gold)}
.cta{margin-top:40px;padding:30px;text-align:center;color:#fff;border-radius:22px;background:linear-gradient(135deg,var(--navy),var(--navy-deep));border:1px solid var(--gold)}
.cta h3{font-size:1.3rem;color:var(--gold-light);margin-bottom:8px}
.cta p{margin-bottom:18px;color:rgba(255,255,255,.8)}
.btn{display:inline-block;padding:13px 34px;font-weight:800;color:var(--navy-deep);background:linear-gradient(135deg,var(--gold-light),var(--gold),var(--gold-dark));border-radius:50px;box-shadow:0 10px 26px rgba(217,187,99,.4);transition:.35s;direction:ltr}
.btn:hover{transform:translateY(-4px) scale(1.04)}
.more{max-width:1100px;margin:0 auto;padding:10px 16px 80px}
.more h2{text-align:center;font-size:1.7rem;font-weight:900;margin-bottom:26px}
.more__grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px}
.rel{display:block;padding:24px;background:#fff;border:1px solid rgba(217,187,99,.5);border-radius:20px;transition:.4s}
.rel:hover{transform:translateY(-8px);box-shadow:0 20px 40px rgba(47,68,89,.18)}
.rel span{font-size:.78rem;font-weight:800;color:var(--gold-dark)}
.rel h3{font-size:1.05rem;font-weight:800;margin-top:4px}
.ft{padding:26px 16px;text-align:center;font-size:.88rem;color:rgba(255,255,255,.7);background:var(--navy-deep);border-top:2px solid var(--gold)}
@media(max-width:640px){.hero{padding:120px 16px 80px}.brand span{font-size:.95rem}.brand img{height:46px}.more__grid{grid-template-columns:1fr}.back{padding:7px 13px;font-size:.8rem}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>

{h:"ما هو الفاليه باركنج؟",p:["الفاليه باركنج هو خدمة استقبال السيارة عند المدخل بواسطة سائق محترف يركنها في موقف مؤمّن، ثم يحضرها لصاحبها عند المغادرة خلال دقائق. يدخل الضيف مباشرة إلى وجهته دون بحث عن موقف أو مشي تحت الشمس أو تأخر عن موعده.","وفي مدن مثل الدمام والرياض والخبر والأحساء، حيث الحرارة العالية وازدحام المواقف، أصبحت الخدمة ضرورة تعكس الاحترام قبل أن تكون رفاهية."]},
{h:"فوائد الخدمة لك ولضيوفك",l:["راحة تامة للضيف من أول لحظة وصول وحتى المغادرة","توفير الوقت وإنهاء أزمة البحث عن موقف","حماية كبار السن والنساء والأطفال من الحرارة والمشي الطويل","انسيابية حركة السيارات وتقليل الازدحام أمام المدخل","صورة راقية تعكس هوية مكانك واهتمامك بالتفاصيل","زيادة رضا العملاء وتشجيعهم على تكرار الزيارة"]},

{h:"معايير اختيار شركة فاليه موثوقة",l:["سائقون مدربون ومؤمّن عليهم وأصحاب سجل نظيف","نظام تذاكر واضح ومتابعة دقيقة لكل سيارة","عدد كافٍ من الكوادر يناسب الحضور فلا تنتظر السيارات طويلًا","خبرة سابقة في الأفراح والمؤتمرات والمستشفيات والمطاعم","تغطية جغرافية ودعم على مدار الساعة"]},
{h:"متى تحتاج الخدمة؟",p:["الفاليه مناسب للأفراح والمؤتمرات والحفلات والفنادق والمطاعم الراقية والمستشفيات والمجمعات التجارية والمقرات الإدارية. وسواء كانت مناسبة ليوم واحد أو عقدًا دائمًا، تختلف الخطة لكن المبدأ واحد: ضيف مرتاح وسمعة أرقى."]}],

weddings:{tag:"تنظيم أفراح",img:"images/serv2.png",date:"18 سبتمبر 2026",read:"7 دقائق",

{h:"أخطاء شائعة يجب تجنبها",l:["الاعتماد على مواقف الشارع وحدها دون خطة بديلة","توظيف أشخاص غير مدربين لركن السيارات","عدم توثيق أرقام التذاكر فتضيع السيارات وسط الزحام","نسيان تجهيز إضاءة كافية للمواقف ليلًا","تجاهل موقف الطوارئ وسيارات الإسعاف"]},
{h:"ماذا تحصل عليه مع الوسام النبيل؟",p:["نوفر فريقًا كاملًا بزي موحد وإدارة ميدانية ومشرفًا يتابع الحركة طوال الحفل، ونتنسق مع القاعة ومنظمي الحفل مسبقًا. ونعمل في الرياض والدمام والخبر والأحساء، فتكون ليلتك على أعلى مستوى من الرقي والتنظيم."]}],
q:"«التنظيم الجيد لا يُرى، لكن أثره يُحس في كل لحظة من ليلتك.»",

contracts:{tag:"عقود وشركات",img:"images/serv5.png",date:"25 سبتمبر 2026",read:"7 دقائق",

s:[
{h:"لماذا العقود الدائمة؟",p:["المطعم أو المستشفى أو الشركة يستقبل الزوار يوميًا، ولا يمكن ترك مواقفه للصدفة. العقد الدائم يوفر فريقًا ثابتًا يعرف المكان وعملاءه، ويضمن جودة واستمرارية بأسعار أفضل من الطلبات المتفرقة."]},
{h:"المطاعم والكافيهات",l:["راحة الزبون تزيد مدة بقائه ورضاه وتكرار زيارته","تقليل الشكاوى من ازدحام المواقف والمخالفات","مظهر راقٍ يرفع مكانة المطعم أمام منافسيه","مرونة في ساعات العمل حسب ذروة الطلب"]},
{h:"المستشفيات والمراكز الطبية",p:["في المنشآت الطبية كل دقيقة لها قيمتها. ينظم الفاليه مواقف المرضى والزوار ويحافظ على مسارات الطوارئ خالية، ويساعد كبار السن وذوي الاحتياجات الخاصة عند الوصول، فيقلل التوتر ويرفع مستوى الخدمة."]},
{h:"الشركات والفنادق والمتاجر",l:["استقبال راقٍ للعملاء والشركاء وكبار الزوار","تخفيف ضغط مواقف الموظفين في أوقات الذروة","زيادة أعداد زوار المتاجر والمجمعات بسبب سهولة الوصول","صورة مؤسسية تعكس الاحترافية"]},
{h:"ماذا تسأل قبل توقيع العقد؟",l:["ما نوع التأمين وما حدود تغطيته؟","كم عدد الكوادر وما ساعات عملهم؟","كيف تُوثق حالة السيارة عند الاستلام؟","ما آلية التعامل مع الشكاوى والطوارئ؟","هل تتوفر تقارير أداء دورية؟","ما مدة العقد وشروط التجديد والإنهاء؟"]},
{h:"مؤشرات نجاح الخدمة",p:["راقب زمن تسليم السيارة ورضا العملاء وعدد الشكاوى وانسيابية الحركة أمام المدخل. الشركة الجيدة تقدم لك تقارير واضحة وتتطور معك، وهذا ما نلتزم به في الوسام النبيل مع شركائنا في الرياض والدمام والخبر والأحساء."]}],
q:"«الفاليه الناجح يجعل عميلك يبتسم قبل أن يدخل، ويعود قبل أن يفكر.»",
